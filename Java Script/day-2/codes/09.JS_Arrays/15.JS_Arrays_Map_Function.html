<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Arrays </title>
</head>
<body>
    <div>
        <h2>Java Script | Array map()</h2>
    </div>

    <script>
        let data = [1, 2, 3, 4, 5]
        console.log(data);
        /*
        let dataDouble = data.map(function(n){
            alert(n)
                return n * 2;
        });
        */
        let dataDouble = data.map(n => n * 2);  
        console.log(dataDouble);
    </script>

    <script>
        const numbers = [4, 9, 16, 25];
        //const newArr = numbers.map(n => Math.sqrt(n))
        const newArr = numbers.map(Math.sqrt)
        console.log(newArr)
    </script>
</body>
</html>

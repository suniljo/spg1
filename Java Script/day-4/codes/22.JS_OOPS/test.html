        class Rectangle{
            constructor(len, bre){
                this.length = len;
                this.breadth = bre;
            }

            calculateArea(){

            }

<script>
    class Customer{
        constructor(custId, custName, city){
            this.customerId = custId;
            this.customerName = custName;
            this.customerCity = city;
        }

        displayCustomer(){
            document.write(`<br>ID: ${this.customerId} | NAME: ${this.customerName} | CITY: ${this.customerCity}`)
        }
    }

    class RetailCustomer extends Customer{
        constructor(custId, custName, city, retailerRegId){
            super(custId, custName, city);
            this.retailerRegistrationId = retailerRegId;
        }
        displayCustomer(){
            super.displayCustomer();
            document.write(` | RETAILER ID: ${this.retailerRegistrationId}`)
        }        
    }
</script>

<script>
    let customerObj = new Customer(10001, 'Sanjay Patil', 'Mumbai');
    customerObj.displayCustomer();

    let customerObj1 = new RetailCustomer(10001, 'Sanjay Patil', 'Mumbai', 'RET-9237346');
    customerObj1.displayCustomer();    
</script>
